<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 · 工单管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6366f1;--primary-hover:#4f46e5;--primary-bg:#eef2ff;--primary-border:#c7d2fe;
  --success:#10b981;--success-bg:#ecfdf5;--warning:#f59e0b;--warning-bg:#fffbeb;
  --danger:#ef4444;--danger-bg:#fef2f2;--info:#3b82f6;--info-bg:#eff6ff;
  --text-900:#0f172a;--text-800:#1e293b;--text-700:#334155;--text-600:#475569;--text-500:#64748b;--text-400:#94a3b8;
  --bg-page:#f8fafc;--bg-card:#ffffff;--bg-hover:#f1f5f9;--bg-input:#f8fafc;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --shadow-xs:0 1px 2px rgba(15,23,42,0.04);--shadow-sm:0 1px 3px rgba(15,23,42,0.06);--shadow-md:0 4px 6px -1px rgba(15,23,42,0.08);
  --radius:8px;--radius-md:10px;--radius-lg:12px;--radius-xl:16px;
  --sidebar-width:260px;--topbar-height:64px;
}
body{background:var(--bg-page);color:var(--text-800);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app-layout{display:flex;min-height:100vh}
.app-sidebar{width:var(--sidebar-width);background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border-light)}
.sidebar-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),#8b5cf6);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(99,102,241,0.35);flex-shrink:0}
.sidebar-title{font-size:16px;font-weight:700;color:var(--text-900)}
.sidebar-subtitle{font-size:11px;color:var(--text-400);margin-top:1px}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-section{margin-bottom:20px}
.nav-section-title{font-size:11px;font-weight:600;color:var(--text-400);text-transform:uppercase;letter-spacing:.8px;padding:0 12px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);font-size:13.5px;font-weight:500;color:var(--text-600);cursor:pointer;transition:all .15s;margin-bottom:2px;user-select:none;position:relative}
.nav-item:hover{background:var(--bg-hover);color:var(--text-800)}
.nav-item.active{background:var(--primary-bg);color:var(--primary-hover);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border-light)}
.sidebar-footer .nav-item:hover{color:var(--danger);background:var(--danger-bg)}
.app-main{flex:1;margin-left:var(--sidebar-width);display:flex;flex-direction:column;min-height:100vh;min-width:0}
.app-topbar{height:var(--topbar-height);background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:18px;font-weight:700;color:var(--text-900)}
.topbar-actions{display:flex;align-items:center;gap:12px}
.app-content{flex:1;padding:28px;max-width:100%}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:15px;font-weight:600;color:var(--text-900)}
.card-body{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;user-select:none}
.btn-primary{background:var(--primary);color:white;box-shadow:0 1px 3px rgba(99,102,241,0.3)}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.btn-secondary{background:var(--bg-card);color:var(--text-700);border-color:var(--border)}
.btn-secondary:hover{background:var(--bg-hover);border-color:var(--text-300)}
.btn-ghost{background:transparent;color:var(--text-600);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text-800)}
.btn-success{background:var(--success);color:white}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;color:var(--text-800);background:var(--bg-input);transition:all .15s;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.12);background:white}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-primary{background:var(--primary-bg);color:var(--primary-hover)}
.badge-success{background:var(--success-bg);color:#047857}
.badge-warning{background:var(--warning-bg);color:#b45309}
.badge-danger{background:var(--danger-bg);color:#dc2626}
.badge-info{background:var(--info-bg);color:#2563eb}
.badge-secondary{background:var(--bg-hover);color:var(--text-600)}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-xs);transition:all .2s}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--primary-border)}
.stat-value{font-size:28px;font-weight:800;color:var(--text-900);line-height:1.1;margin-bottom:4px}
.stat-label{font-size:13px;color:var(--text-500);font-weight:500}
.stat-icon{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:18px}
.data-table{width:100%;border-collapse:collapse;font-size:13.5px}
.data-table thead th{background:var(--bg-page);color:var(--text-500);font-weight:600;font-size:12px;text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.data-table tbody td{padding:12px 16px;border-bottom:1px solid var(--border-light);color:var(--text-700);vertical-align:middle}
.data-table tbody tr{transition:background .1s;cursor:pointer}
.data-table tbody tr:hover{background:var(--bg-page)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table .action-col{white-space:nowrap;text-align:right}
.code-text{font-family:'SF Mono',Monaco,monospace;font-size:12px;font-weight:600;color:var(--primary-hover);background:var(--primary-bg);padding:3px 8px;border-radius:4px}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:12px}
.pagination-info{font-size:13px;color:var(--text-500)}
.pagination-controls{display:flex;align-items:center;gap:4px}
.pagination-btn{min-width:32px;height:32px;padding:0 10px;border:1px solid var(--border);background:white;color:var(--text-600);border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;font-weight:500}
.pagination-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.pagination-btn.active{background:var(--primary);color:white;border-color:var(--primary)}
.pagination-btn:disabled{opacity:.4;cursor:not-allowed}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center}
.empty-state-icon{width:56px;height:56px;border-radius:50%;background:var(--bg-page);display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--text-400)}
.empty-state-title{font-size:14px;font-weight:600;color:var(--text-700);margin-bottom:4px}
.empty-state-desc{font-size:13px;color:var(--text-400)}
.filter-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filter-bar select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text-700);background:white;cursor:pointer;outline:none;min-width:120px;width:auto}
.filter-bar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.12)}
.filter-bar .search-input{flex:1;min-width:180px;max-width:300px}
.batch-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--primary-bg);border-bottom:1px solid var(--primary-border);font-size:13px;color:var(--text-600)}
.batch-bar .selected-count{font-weight:700;color:var(--primary-hover)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text-900);color:white;padding:11px 22px;border-radius:var(--radius-md);font-size:13.5px;font-weight:500;z-index:9999;box-shadow:0 10px 15px rgba(0,0,0,0.1);animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--text-700);cursor:pointer;padding:6px;border-radius:var(--radius)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.4);z-index:99}
.sidebar-overlay.show{display:block}
.hidden{display:none!important}
@media(max-width:768px){
  .app-sidebar{transform:translateX(-100%);box-shadow:var(--shadow-md)}
  .app-sidebar.open{transform:translateX(0)}
  .app-main{margin-left:0}
  .mobile-menu-btn{display:flex}
  .app-content{padding:16px}
  .app-topbar{padding:0 16px}
  .grid-4,.grid-2{grid-template-columns:1fr!important;gap:12px!important}
  .stat-value{font-size:22px}
  .data-table{font-size:12px;min-width:600px}
  .data-table thead th,.data-table tbody td{padding:10px 12px;white-space:nowrap}
  .pagination{flex-direction:column;align-items:stretch}
  .filter-bar{flex-direction:column;align-items:stretch}
  .filter-bar .search-input{max-width:none}
}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <div><div class="sidebar-title">后台管理</div><div class="sidebar-subtitle">管理控制台 v9.0</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">主导航</div>
        <div class="nav-item" onclick="location.href='/admin'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>控制台</div>
        <div class="nav-item" onclick="location.href='/tools/gen-license'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>激活码管理</div>
        <div class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>工单管理</div>
        <div class="nav-item" onclick="location.href='/update-history.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>更新历史</div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="localStorage.clear();location.href='/'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="overlay" onclick="document.getElementById('sidebar').classList.remove('open')"></div>
  <div class="app-main">
    <header class="app-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.add('open')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <button class="btn btn-ghost btn-sm" onclick="location.href='/admin'">← 返回</button>
        <h1 class="topbar-title">工单管理</h1>
      </div>
      <div class="topbar-actions">
        <span class="badge badge-primary" id="pendingBadge">待处理 0</span>
        <button class="btn btn-secondary btn-sm" onclick="loadDashboard()">🔄 刷新</button>
      </div>
    </header>
    <main class="app-content" id="app">
      <div class="grid-4" style="margin-bottom:20px" id="statsCards"></div>
      <div id="page-list">
        <div class="card">
          <div class="card-header">
            <div class="card-title">工单列表</div>
            <button class="btn btn-secondary btn-sm" onclick="exportCSV()">📥 导出CSV</button>
          </div>
          <div class="filter-bar">
            <span style="font-size:12px;font-weight:600;color:var(--text-500)">状态:</span>
            <select id="filterStatus" onchange="renderTickets()"><option value="all">全部</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select>
            <span style="font-size:12px;font-weight:600;color:var(--text-500);margin-left:8px">类型:</span>
            <select id="filterType" onchange="renderTickets()"><option value="all">全部</option><option value="bug">Bug反馈</option><option value="feature">功能建议</option><option value="account">账号问题</option><option value="payment">支付问题</option><option value="other">其他</option></select>
            <div class="search-input"><input type="text" id="filterKeyword" placeholder="搜索工单ID/标题/内容..." oninput="renderTickets()"></div>
          </div>
          <div id="ticketList"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
      <div id="page-detail" class="hidden">
        <button class="btn btn-secondary btn-sm" style="margin-bottom:16px" onclick="showList()">← 返回列表</button>
        <div id="detailContent"></div>
      </div>
    </main>
  </div>
</div>
<script>
const API_BASE = "https://api.ttla.top";
let adminHash = localStorage.getItem("ticket_admin_hash") || "";
let currentPage = 1;
let totalPages = 1;
let currentTicket = null;
let allTickets = [];

// 简单哈希
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return Math.abs(hash);
}

// 登录
function doLogin() {
  // 统一登录：检查bbb后台登录状态和15分钟失效
  const loginTime = parseInt(localStorage.getItem("bbb_login_time") || "0");
  const expired = Date.now() - loginTime > 15 * 60 * 1000;
  if (localStorage.getItem("bbb_admin_authed") !== "true" || expired) {
    localStorage.clear();
    window.location.href = "/";
    return;
  }
  localStorage.setItem("bbb_login_time", String(Date.now()));
  adminHash = localStorage.getItem("bbb_admin_hash") || "535441809";
  // 显示主应用
  var appEl = document.getElementById("app");
  if (appEl) appEl.style.display = "flex";
  loadDashboard();
  if (typeof startAutoRefresh === "function") startAutoRefresh();
  if (typeof loadDashboard === "function") loadDashboard();
}



function logout() {
  localStorage.removeItem("ticket_admin_hash");
  adminHash = "";
  location.reload();
}

// 导航
function navigate(page) {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add("active");
  document.querySelectorAll(".page").forEach(p => p.style.display = "none");
  document.getElementById("page-" + page).style.display = "block";
  if (window.innerWidth < 768) toggleSidebar();
  
  if (page === "list") loadDashboard();
  if (page === "processing") loadProcessing();
  if (page === "stats") loadStats();
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

// 加载仪表盘
async function loadDashboard() {
  try {
    const res = await fetch(API_BASE + "/ticket/list", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passwordHash: adminHash, page: currentPage, pageSize: 20 })
    });
    const data = await res.json();
    if (data.success) {
      allTickets = data.tickets;
      totalPages = data.totalPages;
      renderStatsCards(data.stats);
      renderTicketList(data.tickets);
      renderPagination();
      document.getElementById("pendingBadge").textContent = data.stats.pending || 0;
    }
  } catch (e) { toast("加载失败: " + e.message); }
}

function renderStatsCards(stats) {
  const cards = [
    { label: "工单总数", value: stats.total, cls: "total" },
    { label: "待处理", value: stats.pending, cls: "pending" },
    { label: "处理中", value: stats.processing, cls: "processing" },
    { label: "已解决", value: stats.resolved, cls: "resolved" },
  ];
  const colors = { total: "#6366f1", pending: "#f59e0b", processing: "#3b82f6", resolved: "#10b981" };
  const icons = { total: "📊", pending: "⏳", processing: "🔧", resolved: "✅" };
  document.getElementById("statsCards").innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${colors[c.cls]}15;color:${colors[c.cls]}">${icons[c.cls]}</div>
      <div class="stat-value" style="color:${colors[c.cls]}">${c.value}</div>
      <div class="stat-label">${c.label}</div>
    </div>
  `).join("");
}

const typeMap = { bug: "🐛 问题", suggestion: "💡 建议", complaint: "⚠️ 投诉", other: "📝 其他" };
const statusMap = { pending: "待处理", processing: "处理中", resolved: "已解决", closed: "已关闭" };
const priorityMap = { low: "低", normal: "普通", high: "高", urgent: "紧急" };

function renderTicketList(tickets, containerId = "ticketList") {
  const container = document.getElementById(containerId);
  if (!tickets.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="empty-state-title">暂无工单数据</div><div class="empty-state-desc">当前筛选条件下没有工单</div></div>';
    return;
  }
  let html = '<div style="overflow-x:auto;"><table class="data-table"><thead><tr>';
  html += '<th class="checkbox-col"><input type="checkbox" class="batch-checkbox" onchange="toggleAllTickets(this)"></th>';
  html += '<th>工单ID</th><th>类型</th><th>状态</th><th>标题</th><th>提交时间</th><th>联系方式</th><th class="action-col">操作</th>';
  html += '</tr></thead><tbody>';
  tickets.forEach(t => {
    html += '<tr>';
    html += '<td class="checkbox-col"><input type="checkbox" class="batch-checkbox ticket-check" value="'+t.id+'"></td>';
    html += '<td><span class="code-text" style="font-size:12px;">'+t.id+'</span></td>';
    html += '<td><span class="badge badge-secondary">'+(typeMap[t.type] || t.type)+'</span></td>';
    html += '<td><span class="badge badge-'+(t.status==='resolved'?'success':t.status==='processing'?'warning':t.status==='closed'?'secondary':'primary')+'">'+(statusMap[t.status] || t.status)+'</span></td>';
    html += '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(t.title)+'</td>';
    html += '<td class="text-xs text-slate-500">'+(t.createdStr || '-')+'</td>';
    html += '<td class="text-xs text-slate-500">'+(t.contact ? escapeHtml(t.contact) : '-')+'</td>';
    html += '<td class="action-col"><div style="display:flex;gap:6px;justify-content:flex-end;">';
    html += '<button onclick="event.stopPropagation();openTicket(\''+t.id+'\')" class="btn btn-primary btn-sm">查看详情</button>';
    if (t.status === 'pending') html += '<button onclick="event.stopPropagation();quickResolve(\''+t.id+'\')" class="btn btn-success btn-sm">标记已处理</button>';
    html += '<button onclick="event.stopPropagation();quickResolve(\''+t.id+'\')" class="px-2 py-1 text-xs text-green-600 hover:bg-green-50 rounded transition">处理</button>';
    html += '</div></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  // 批量操作栏
  html += '<div class="batch-bar" id="batchBar" style="display:none;">';
  html += '<span>已选择 <span class="selected-count" id="selectedCount">0</span> 项</span>';
  html += '<button onclick="batchResolve()" class="px-3 py-1 text-xs text-green-600 bg-green-50 hover:bg-green-100 rounded transition">批量标记已处理</button>';
  html += '<button onclick="batchClose()" class="px-3 py-1 text-xs text-slate-600 bg-slate-50 hover:bg-slate-100 rounded transition">批量关闭</button>';
  html += '<button onclick="clearTicketSelection()" class="px-3 py-1 text-xs text-slate-500 hover:bg-slate-100 rounded transition ml-auto">取消选择</button>';
  html += '</div>';
  container.innerHTML = html;
  // 绑定复选框事件
  document.querySelectorAll('.ticket-check').forEach(cb => {
    cb.addEventListener('change', updateBatchBar);
  });
}

// 批量操作相关函数
let selectedTickets = new Set();
function toggleAllTickets(cb) {
  document.querySelectorAll('.ticket-check').forEach(c => { c.checked = cb.checked; });
  updateBatchBar();
}
function updateBatchBar() {
  selectedTickets.clear();
  document.querySelectorAll('.ticket-check:checked').forEach(cb => selectedTickets.add(cb.value));
  const bar = document.getElementById('batchBar');
  const count = document.getElementById('selectedCount');
  if (bar) {
    bar.style.display = selectedTickets.size > 0 ? 'flex' : 'none';
    if (count) count.textContent = selectedTickets.size;
  }
}
function clearTicketSelection() {
  document.querySelectorAll('.ticket-check').forEach(c => { c.checked = false; });
  document.querySelectorAll('.batch-checkbox').forEach(c => { c.checked = false; });
  selectedTickets.clear();
  updateBatchBar();
}
async function batchResolve() {
  if (!selectedTickets.size) return;
  if (!confirm('确定要将选中的 '+selectedTickets.size+' 个工单标记为已处理吗？')) return;
  for (const id of selectedTickets) {
    try {
      await fetch(API_BASE + '/ticket/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passwordHash: adminHash, id, content: '批量处理：工单已处理', status: 'resolved' })
      });
    } catch(e) {}
  }
  toast('批量处理完成');
  clearTicketSelection();
  loadDashboard();
}
async function batchClose() {
  if (!selectedTickets.size) return;
  if (!confirm('确定要关闭选中的 '+selectedTickets.size+' 个工单吗？')) return;
  for (const id of selectedTickets) {
    try {
      await fetch(API_BASE + '/ticket/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passwordHash: adminHash, id, status: 'closed' })
      });
    } catch(e) {}
  }
  toast('批量关闭完成');
  clearTicketSelection();
  loadDashboard();
}
async function quickResolve(id) {
  if (!confirm('确定将此工单标记为已处理？')) return;
  try {
    await fetch(API_BASE + '/ticket/reply', {

function renderPagination() {
  const pg = document.getElementById("pagination");
  if (totalPages <= 1) { pg.innerHTML = ""; return; }
  let html = `<button onclick="goPage(${currentPage-1})" ${currentPage===1?"disabled":""}>上一页</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
      html += `<button class="${i===currentPage?"active":""}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 3) {
      html += `<span>...</span>`;
    }
  }
  html += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>下一页</button>`;
  html += `<span>共${totalPages}页</span>`;
  pg.innerHTML = html;
}

function goPage(p) {
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  loadDashboard();
}

      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passwordHash: adminHash, id: currentTicket.id, content, status })
    });
    const data = await res.json();

      currentTicket = data.ticket;
      showDetail();
      toast("回复成功");
    } else {
      toast(data.message || "回复失败");
    }

}

// 搜索
async function doSearch() {
  const status = document.getElementById("searchStatus").value;
  const keyword = document.getElementById("searchKeyword").value;
  try {
    const res = await fetch(API_BASE + "/ticket/list", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passwordHash: adminHash, status, keyword, pageSize: 100 })
    });
    const data = await res.json();
    let tickets = data.tickets || [];
    // 前端过滤日期和优先级
    const priority = document.getElementById("searchPriority").value;
    const dateFrom = document.getElementById("searchDateFrom").value;
    const dateTo = document.getElementById("searchDateTo").value;
    if (priority !== "all") tickets = tickets.filter(t => t.priority === priority);
    if (dateFrom) tickets = tickets.filter(t => new Date(t.createdAt) >= new Date(dateFrom));
    if (dateTo) tickets = tickets.filter(t => new Date(t.createdAt) <= new Date(dateTo + "T23:59:59"));
    renderTicketList(tickets, "searchList");
    toast(`找到 ${tickets.length} 条结果`);
  } catch (e) { toast("搜索失败"); }
}

function resetSearch() {
  document.getElementById("searchStatus").value = "all";
  document.getElementById("searchPriority").value = "all";
  document.getElementById("searchType").value = "all";
  document.getElementById("searchDateFrom").value = "";

// 导出CSV
function exportCSV() {
  if (!allTickets.length) { toast("暂无数据可导出"); return; }
  const headers = ["工单ID", "类型", "标题", "内容", "状态", "优先级", "联系方式", "IP", "创建时间", "回复数"];
  const rows = allTickets.map(t => [
    t.id, typeMap[t.type] || t.type, t.title, t.content.replace(/,/g,"，"),
    statusMap[t.status] || t.status, priorityMap[t.priority] || t.priority,
    t.contact || "", t.ip || "", t.createdStr, t.replies.length
  ]);
  const csv = "\uFEFF" + [headers, ...rows].map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `工单导出_${new Date().toLocaleDateString()}.csv`;
  link.click();
  toast("导出成功");
}

function exportFilteredCSV() { exportCSV(); }

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function toast(msg) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
